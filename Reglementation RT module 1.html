<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Module de Formation 1 - BSF Orly</title>
    <style>
        /* On conserve exactement le même style pour la cohérence visuelle */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #2d3436;
            line-height: 1.6;
            background-color: #f4f7f6;
        }

        .header {
            background: linear-gradient(135deg, #2980b9 0%, #2c3e50 100%);
            color: white;
            padding: 40pt 20pt;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 24pt;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .container {
            padding: 30pt;
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-nav {
            margin-bottom: 30px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 10pt;
            transition: all 0.3s ease;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-back:hover {
            color: #3498db;
            transform: translateX(-5px);
        }

        .steps-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .step-card {
            background: white;
            border-left: 6px solid #e67e22; /* Orange pour différencier les modules */
            border-radius: 8px;
            padding: 20px 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .step-title { 
            color: #2c3e50;
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 11pt;
            margin-bottom: 8px;
            display: block;
        }

        .inner-link {
            background-color: #e67e22;
            color: white;
            text-decoration: none;
            padding: 6pt 12pt;
            border-radius: 4pt;
            font-size: 9pt;
            font-weight: bold;
            transition: background 0.2s;
            display: inline-block;
        }

        .inner-link:hover {
            background-color: #d35400;
        }

        .footer {
            text-align: center;
            padding: 40pt 20pt 20pt;
            font-size: 10pt;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Module de Formation 1</h1>
        <p>Réglementation Transfrontalière - Détails et supports</p>
    </div>

    <div class="container">
        <div class="back-nav">
            <!-- Ce bouton permet de revenir à la page précédente -->
            <a href="votre_page_principale.html" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Retour à la Réglementation
            </a>
        </div>

        <div class="steps-grid">
            <div class="step-card">
                <span class="step-title">Contenu du Module 1</span>
                <p>Consultez ici les supports de cours et les fiches pratiques du premier module.</p>
                <a href="#" class="inner-link">➤ Ouvrir le support PDF</a>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 BSF Orly - Module de Formation.
    </div>

</body>
</html>
