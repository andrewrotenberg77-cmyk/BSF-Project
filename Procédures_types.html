<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Procédures Types - BSF Orly</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #2d3436;
            line-height: 1.6;
            background-color: #f4f7f6;
        }

        .header {
            background: linear-gradient(135deg, #2980b9 0%, #2c3e50 100%);
            color: white;
            padding: 40pt 20pt;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 24pt;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .container {
            padding: 30pt;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-nav {
            margin-bottom: 30px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 10pt;
            transition: all 0.3s ease;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-back:hover {
            color: #3498db;
            transform: translateX(-5px);
        }

        /* Grille des boutons rectangulaires */
        .procedures-grid {
            display: grid;
            grid-template-columns: 1fr; /* Une seule colonne par défaut pour le mobile */
            gap: 15px;
            margin-top: 20px;
        }

        /* Style des boutons rectangulaires */
        .proc-button {
            background: white;
            border-left: 6px solid #3498db; /* Rappel du style des sections du portail */
            border-top: 1px solid #eee;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 20px 25px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 12pt;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .proc-button span {
            flex-grow: 1;
        }

        /* Petit chevron à droite pour le style */
        .proc-button::after {
            content: '→';
            font-size: 14pt;
            color: #3498db;
            transition: transform 0.2s ease;
        }

        .proc-button:hover {
            background-color: #fff;
            border-left-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .proc-button:hover::after {
            transform: translateX(5px);
        }

        .footer {
            text-align: center;
            padding: 40pt 20pt 20pt;
            font-size: 10pt;
            color: #7f8c8d;
        }

        /* Passage à 2 colonnes sur tablette/ordinateur */
        @media (min-width: 600px) {
            .procedures-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Procédures Types</h1>
        <p>Sélectionnez une catégorie pour accéder aux documents.</p>
    </div>

    <div class="container">
        <div class="back-nav">
            <a href="formation.html" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Retour Formation
            </a>
        </div>

        <div class="procedures-grid">
            <a href="Racoleur.html" class="proc-button">
                <span>1. Racoleur</span>
            </a>

            <a href="Emballeur.html" class="proc-button">
                <span>2. Emballeur</span>
            </a>

            <a href="Brèves.html" class="proc-button">
                <span>3. Brèves</span>
            </a>

            <a href="Autre PV.html" class="proc-button">
                <span>4. Autre PV</span>
            </a>

            <a href="Règlementation.html" class="proc-button">
                <span>5. Règlementation</span>
            </a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 BSF Orly - Portail d'Apprentissage.
    </div>

</body>
</html>
